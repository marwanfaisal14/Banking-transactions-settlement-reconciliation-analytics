name: Reconciliation controls
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine-and-sql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -v
      - run: python -m payments_analytics generate
      - run: python -m payments_analytics build
      - name: Confirm committed demo artifacts reproduce exactly
        run: git diff --exit-code -- data/raw docs/data/report.json docs/findings.md
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
  powerbi-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-powerbi-dev.txt
      - run: python scripts/validate_powerbi.py
      - run: python scripts/build_powerbi.py
      - name: Confirm the source package rebuilds exactly
        run: git diff --exit-code -- powerbi
